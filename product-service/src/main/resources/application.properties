##################################################
# Application
##################################################

spring.application.name=product-service

##################################################
# Server
##################################################

server.port=8082

##################################################
# Eureka
##################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

##################################################
# MySQL
##################################################

spring.datasource.url=jdbc:mysql://localhost:3306/orderflow_product?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA
##################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

##################################################
# Redis
##################################################

spring.data.redis.host=localhost
spring.data.redis.port=6379

####################################################
# Actuator / Observability
####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus,beans,configprops

management.endpoint.health.show-details=always

management.metrics.tags.application=${spring.application.name}


# =====================================================
# OpenTelemetry / Jaeger
# =====================================================

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.tracing.export.enabled=true
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.tracing.transport=http

logging.level.io.micrometer.tracing=DEBUG
logging.level.io.opentelemetry.exporter.otlp=DEBUG

##################################################
# Logging
##################################################

logging.level.com.orderflow.product=INFO