##################################################
# Application
##################################################

spring.application.name=inventory-service


##################################################
# Server
##################################################

server.port=8085


##################################################
# Eureka
##################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
# ==========================================
# Kafka
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092

# ==========================================
# Kafka Consumer
# ==========================================

spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ==========================================
# Kafka Producer
# ==========================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1
spring.kafka.listener.missing-topics-fatal=false
##################################################
# MySQL
##################################################

spring.datasource.url=jdbc:mysql://localhost:3306/orderflow_inventory?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root

spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


##################################################
# JPA / Hibernate
##################################################

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


####################################################
# Actuator / Observability
####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.metrics.tags.application=${spring.application.name}

##################################################
# Logging
##################################################

logging.level.com.orderflow.inventory=INFO