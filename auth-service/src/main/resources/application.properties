##################################################
# Application
##################################################

spring.application.name=auth-service

logging.level.org.springframework.security=DEBUG
logging.level.com.orderflow.auth=DEBUG


##################################################
# Server
##################################################

server.port=8081


##################################################
# Eureka Client
##################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


##################################################
# MySQL Database
##################################################

spring.datasource.url=jdbc:mysql://localhost:3306/orderflow_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


##################################################
# JPA / Hibernate
##################################################

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

##################################################
# JWT
##################################################

jwt.secret=OrderFlowSuperSecretKeyForDevelopmentOnlyChangeThisInProduction123456789
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

####################################################
# Actuator / Observability
####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.metrics.tags.application=${spring.application.name}